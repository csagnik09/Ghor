<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1014">
<title>ঘর</title>
<script src="/shared/home.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Bengali font only for the letters of the ঘর / সুর / ছবি names -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@700&text=%E0%A6%98%E0%A6%9B%E0%A6%AC%E0%A6%B0%E0%A6%B8%E0%A6%BF%E0%A7%81&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 90 90'%3E%3Crect width='90' height='90' rx='22' fill='%231db954'/%3E%3Cpath d='M20 46 45 24l25 22M28 40v26h34V40' fill='none' stroke='black' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-view="home">

  <!-- top strip -->
  <header id="strip" class="panel">
    <div class="logo">
      <svg class="mark" viewBox="0 0 90 90" aria-hidden="true"><rect width="90" height="90" rx="22" fill="#1db954"/><path d="M20 46 45 24l25 22M28 40v26h34V40" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lb">ঘর</span>
    </div>
    <nav id="nav">
      <button class="nav on" data-v="home"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg><span data-t="home"></span></button>
      <button class="nav" data-v="cal"><svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3zM5 9v10h14V9zm2 2h3v3H7z"/></svg><span data-t="calendar"></span></button>
      <button class="nav" data-v="alarm"><svg viewBox="0 0 24 24"><path d="M12 4a9 9 0 1 1 0 18 9 9 0 0 1 0-18zm-1 4v6l5 3 1-1.6-4-2.4V8zM2.3 6.6 6.6 2.3l1.4 1.4-4.3 4.3zm19.4 0-1.4 1.4L16 3.7l1.4-1.4z"/></svg><span data-t="alarms"></span></button>
    </nav>
    <span id="net" class="chip" title="Network"><i></i><span></span></span>
    <button id="fs" class="round" aria-label="Full screen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM6 15v3h3v2H4v-5zm12 0h2v5h-5v-2h3z"/></svg>
    </button>
    <button id="theme" class="round" aria-label="Theme">
      <svg class="i-auto" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2v16a8 8 0 0 1 0-16z"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg>
    </button>
    <button id="openSet" class="round" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <!-- clock stage -->
  <section id="stage">
    <div id="hello"><span id="hIcon" aria-hidden="true"></span><span id="greet"></span></div>
    <div id="time"><span id="hm">--:--</span><span id="sec"></span><span id="ampm"></span></div>
    <div id="date"></div>
    <div id="sunbar">
      <div class="sunrow"><span id="srise">--:--</span><span id="sset">--:--</span></div>
      <div class="track"><div id="sunfill"></div><div id="sundot"></div></div>
      <div class="sunrow small"><span data-t="sunrise"></span><span id="daylen"></span><span data-t="sunset"></span></div>
    </div>
    <div id="glance"></div>
  </section>

  <!-- right side: views -->
  <main id="content">

    <!-- HOME -->
    <div class="view" id="v-home">
      <section id="weather" class="panel">
        <div class="phead"><small data-t="weather"></small><button id="wRefresh" class="pill">↻ <span id="wUpd">—</span></button></div>
        <div id="wNow">
          <div id="wIcon" class="wicon"></div>
          <div><div id="wTemp">--°</div><div id="wDesc"></div><div id="wPlace" class="muted"></div></div>
        </div>
        <div id="wStats">
          <div><span class="muted" data-t="feels"></span><b id="wFeel">--</b></div>
          <div><span class="muted" data-t="humidity"></span><b id="wHum">--</b></div>
          <div><span class="muted" data-t="wind"></span><b id="wWind">--</b></div>
          <div><span class="muted" data-t="rain"></span><b id="wRain">--</b></div>
        </div>
        <div id="wDays"></div>
      </section>

      <section class="panel block">
        <div class="phead"><small data-t="apps"></small><button id="addApp" class="pill" data-t="addApp"></button></div>
        <div id="tiles" class="apps"></div>
      </section>

      <section class="panel block">
        <div class="phead"><small data-t="switches"></small><button id="addSw" class="pill" data-t="addSwitch"></button></div>
        <div id="switches" class="tiles"></div>
      </section>
    </div>

    <!-- CALENDAR -->
    <div class="view" id="v-cal" hidden>
      <section class="panel block cal">
        <div class="calhead">
          <h2 id="calTitle"></h2>
          <div class="calnav">
            <button id="calToday" class="pill" data-t="today"></button>
            <button id="calPrev" class="round" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7z"/></svg></button>
            <button id="calNext" class="round" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7z"/></svg></button>
          </div>
        </div>
        <div id="calWeek" class="calgrid wk"></div>
        <div id="calGrid" class="calgrid"></div>
      </section>
      <section class="panel block">
        <div class="phead"><small id="dayTitle"></small></div>
        <form id="evForm" class="addrow">
          <input id="evTitle" required autocomplete="off">
          <input id="evTime" type="time">
          <button class="addbtn" data-t="add"></button>
        </form>
        <div id="evList" class="list"></div>
      </section>
    </div>

    <!-- ALARMS -->
    <div class="view" id="v-alarm" hidden>
      <section class="panel block">
        <div class="phead"><small data-t="alarms"></small></div>
        <form id="alForm" class="addrow">
          <input id="alTime" type="time" required>
          <input id="alLabel" autocomplete="off">
          <button class="addbtn" data-t="add"></button>
        </form>
        <div id="alDays" class="days"></div>
        <div id="soundHint" class="hint" data-t="soundHint"></div>
        <div id="alList" class="list"></div>
      </section>
    </div>
  </main>
</div>

<!-- alarm ringing -->
<div id="ring" role="alertdialog" aria-live="assertive">
  <div class="ringbox">
    <div class="pulse"><svg viewBox="0 0 24 24"><path d="M12 4a9 9 0 1 1 0 18 9 9 0 0 1 0-18zm-1 4v6l5 3 1-1.6-4-2.4V8z"/></svg></div>
    <div id="ringTime"></div>
    <div id="ringLabel"></div>
    <div class="ringbtns">
      <button id="snooze" data-t="snooze"></button>
      <button id="stopAl" data-t="stop"></button>
    </div>
  </div>
</div>

<!-- settings -->
<div id="dlg" role="dialog" aria-modal="true">
  <form class="box" id="setForm">
    <h3 data-t="settings"></h3>
    <div class="two">
      <label title="Shared with সুর and ছবি"><span data-t="theme"></span>
        <select id="sTheme"><option value="auto" data-t="themeAuto"></option><option value="light" data-t="themeLight"></option><option value="dark" data-t="themeDark"></option></select>
      </label>
      <label><span data-t="yourName"></span><input id="sName" autocomplete="off"></label>
    </div>
    <label><span data-t="city"></span><input id="sCity" placeholder="Katwa" autocomplete="off"></label>
    <div class="two">
      <label><span data-t="units"></span>
        <select id="sUnits"><option value="c">°C · km/h</option><option value="f">°F · mph</option></select>
      </label>
      <label><span data-t="clock"></span>
        <select id="sClock"><option value="12" data-t="h12"></option><option value="24" data-t="h24"></option></select>
      </label>
    </div>

    <div class="sep" data-t="appButtons"></div>
    <div id="appRows"></div>
    <label class="check"><input type="checkbox" id="sNewTab"> <span data-t="newTab"></span></label>

    <div class="sep" data-t="switches"></div>
    <p class="note" data-t="switchNote"></p>
    <div id="swRows"></div>

    <div class="bt">
      <button type="button" id="setCancel" data-t="cancel"></button>
      <button type="submit" id="setOk" data-t="save"></button>
    </div>
  </form>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
